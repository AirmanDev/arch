name: Build AirAdmin Recovery

on:
  push:
    branches: [main]
    paths:
      - 'airadmin-recovery/**'
      - '.github/workflows/airadmin-recovery-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore airadmin-recovery/AirAdmin.Recovery.csproj

      - name: Build
        run: dotnet publish airadmin-recovery/AirAdmin.Recovery.csproj -c Release -o build/recovery --no-self-contained

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package
          cp build/recovery/AirAdmin.Recovery.dll build/package/
          (cd build/package && zip -9 ../AirAdminRecovery_1.0.0.0.zip AirAdmin.Recovery.dll)
          md5sum build/AirAdminRecovery_1.0.0.0.zip | tee build/AirAdminRecovery_1.0.0.0.md5
          sha256sum build/AirAdminRecovery_1.0.0.0.zip | tee build/AirAdminRecovery_1.0.0.0.sha256

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: airadmin-recovery
          path: |
            build/AirAdminRecovery_1.0.0.0.zip
            build/AirAdminRecovery_1.0.0.0.md5
            build/AirAdminRecovery_1.0.0.0.sha256
          if-no-files-found: error
